<!doctype html>
<html lang="ar" dir="rtl" manifest="/cache.appcache">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>محمد خالد للشروحات تهكير صيانه تنزيل العاب 07714434273</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #0f172a;
      background: -webkit-linear-gradient(180deg, #0f172a 0%, #0b1220 100%);
      color: #e2e8f0;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      min-height: 100%;
      text-align: center;
    }

    #footer {
      position: fixed;
      bottom: 12px;
      left: 50%;
      -webkit-transform: translateX(-50%);
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #4b5563;
      line-height: 1.5;
      text-align: center;
      z-index: 20;
    }



    main {
      max-width: 42rem;
      padding: 2rem;
    }

    .logo {
      display: inline-block;
      width: 8rem;
      height: 8rem;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.375rem;
      line-height: 1.5;
      color: #94a3b8;
    }

    #status {
      font-size: 1.5rem;
      font-weight: 500;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }

    #progressWrap {
      position: relative;
      width: 100%;
      max-width: 30rem;
      height: 1.25rem;
      margin: 1.75rem auto 0;
      background: #1b2436;
      border: 1px solid #2c3e5a;
      border-radius: 8px;
      overflow: hidden;
    }

    #progressBar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: #38bdf8;
      background: -webkit-linear-gradient(90deg, #2563eb 0%, #38bdf8 100%);
      -webkit-transform: scaleX(0);
      transform: scaleX(0);
      -webkit-transform-origin: left center;
      transform-origin: left center;
      -webkit-transition: -webkit-transform 0.3s ease-out;
      transition: transform 0.3s ease-out;
    }

    #progressPct {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      z-index: 1;
      pointer-events: none;
    }

    #logContainer {
      margin-top: 1rem;
      width: 100%;
      max-width: 40rem;
      height: 12rem;
      background: #000;
      border: 1px solid #2c3e5a;
      border-radius: 8px;
      overflow-y: auto;
      text-align: left;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 0.5rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    #logContainer.error {
      color: #f00;
    }

    #cacheCorruptOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.85);
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      z-index: 100;
    }

    #cacheCorruptOverlay .card {
      background: #1b2436;
      border: 1px solid #2c3e5a;
      border-radius: 12px;
      max-width: 34rem;
      padding: 2rem;
      text-align: center;
    }

    #cacheCorruptOverlay h2 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #fbbf24;
      margin-bottom: 1rem;
    }

    #cacheCorruptOverlay p {
      font-size: 1.125rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 1.5rem;
    }

    #cacheCorruptOverlay .actions {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      gap: 1rem;
    }

    #cacheCorruptOverlay .actions[hidden] {
      display: none !important;
    }

    #cacheCorruptOverlay .btn {
      font-size: 1.125rem;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    #cacheCorruptOverlay .btn.primary {
      background: #2563eb;
      background: -webkit-linear-gradient(90deg, #2563eb 0%, #38bdf8 100%);
      color: #fff;
    }

    #cacheCorruptOverlay .btn.secondary {
      background: #334155;
      color: #e2e8f0;
    }

    #choiceContainer {
      margin-top: 1.5rem;
      width: 100%;
      max-width: 38rem;
      margin-left: auto;
      margin-right: auto;
    }

    #choiceContainer[hidden] {
      display: none !important;
    }

    .choice-grid {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      gap: 1.25rem;
      margin-top: 1rem;
      text-align: left;
    }

    .choice-card {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      background: #1b2436;
      border: 2px solid #2c3e5a;
      border-radius: 12px;
      padding: 1.5rem 1.25rem;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      cursor: pointer;
      color: inherit;
      font-family: inherit;
      -webkit-transition: border-color 0.2s, -webkit-transform 0.2s, background-color 0.2s;
      transition: border-color 0.2s, transform 0.2s, background-color 0.2s;
      outline: none;
    }

    .choice-card.selected {
      border-color: rgba(56, 189, 248, 0.4);
      background-color: rgba(56, 189, 248, 0.05);
    }

    .choice-card:hover,
    .choice-card:focus {
      border-color: #38bdf8;
      background-color: #22304a;
      -webkit-transform: translateY(-2px);
      transform: translateY(-2px);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.4);
    }

    .choice-card:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      pointer-events: none;
    }

    .choice-card .choice-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 0.25rem;
    }

    .choice-card .choice-fw {
      display: inline-block;
      align-self: flex-start;
      font-size: 0.8rem;
      font-weight: 600;
      color: #7dd3fc;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      margin-bottom: 0.75rem;
    }

    .choice-card .choice-desc {
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.5;
    }
  </style>

</head>

<body>
  <main>
    <img class="logo" src="/logo.svg" alt="مُحمّل WebKit التلقائي" />
    <h1>مثبّت مُحمّل WebKit التلقائي</h1>
    <p id="status">جارٍ التحميل&hellip;</p>
    <p id="detail"></p>

    <div id="choiceContainer" hidden>
      <div class="choice-grid">
        <button type="button" class="choice-card" id="btnPoops">
          <div class="choice-title">Poops</div>
          <div class="choice-fw">الإصدار 7.00 &ndash; 12.00</div>
          <div class="choice-desc">يعمل دون اتصال بالإنترنت تمامًا. لا يتطلب أي اتصال شبكة أو واجهة شبكة نشطة.</div>
        </button>
        <button type="button" class="choice-card" id="btnRelapse">
          <div class="choice-title">Relapse</div>
          <div class="choice-fw">الإصدار 7.00 &ndash; 13.60 (ما عدا 9.05 و11.40)</div>
          <div class="choice-desc">يتطلب واجهة شبكة نشطة (واي فاي أو إيثرنت). لا يُشترط الاتصال بالإنترنت.</div>
        </button>
      </div>
    </div>

    <div id="progressWrap" hidden>
      <div id="progressBar"></div>
      <div id="progressPct">0%</div>
    </div>
    <div id="logContainer" hidden></div>

  </main>

  <footer id="footer">مثبّت مُحمّل WebKit التلقائي v[[VERSION_PLACEHOLDER]] بواسطة PLK (بُني في [[BUILD_TIME_PLACEHOLDER]])<br />هذا المشروع مجاني ومفتوح المصدر: github.com/itsPLK/ps5-webkit-autoloader</footer>

  <script>
    (function () {
      'use strict';

      function detectFirmware() {
        var m = /PlayStation 5\/(\d+\.\d+)/.exec(navigator.userAgent);
        if (!m) return null;
        return { str: m[1], num: parseFloat(m[1]) };
      }

      var statusEl = document.getElementById('status');
      var detailEl = document.getElementById('detail');
      var choiceContainer = document.getElementById('choiceContainer');
      var btnPoops = document.getElementById('btnPoops');
      var btnRelapse = document.getElementById('btnRelapse');
      var progressWrap = document.getElementById('progressWrap');
      var progressBar = document.getElementById('progressBar');
      var progressPct = document.getElementById('progressPct');
      var completed = false;
      var isDownloading = false;
      var isRetry = false;
      var currentUid = '';
      var chosenExploit = '';
      var fwParam = '';
      var simulateCorrupt = false;
      var corruptionPromptShown = false;

      (function () {
        var params = new URLSearchParams(window.location.search);
        isRetry = params.get('retry') === '1';
        currentUid = params.get('uid') || '';
        chosenExploit = params.get('exploit') || '';
        fwParam = params.get('fw') || '';
        /* خطاف اختبار: ?simulate=corrupt يفرض ظهور رسالة تلف الذاكرة المؤقتة
         * دون الحاجة إلى خطأ AppCache حقيقي (مفيد للاختبار السريع للواجهة
         * في متصفح حاسوب عبر `make dev`). */
        simulateCorrupt = params.get('simulate') === 'corrupt';
      })();

      /* تعريفات دعم الإصدارات:
         - <= 5.50: umtx2
         - 7.00 - 12.00: poops
         - 7.00 - 13.60 (ما عدا 9.05 و11.40): relapse */
      function isUmtx2Supported(num) {
        var n = typeof num === 'number' ? num : parseFloat(num);
        return n > 0 && n <= 5.50;
      }

      function isPoopsSupported(num) {
        var n = typeof num === 'number' ? num : parseFloat(num);
        return n >= 7.00 && n <= 12.00;
      }

      function isRelapseSupported(num, str) {
        var n = typeof num === 'number' ? num : parseFloat(num);
        var s = str || (typeof num === 'string' ? num : '');
        var isExcluded = (s === '9.05' || s === '11.40' ||
                          Math.abs(n - 9.05) < 0.001 || Math.abs(n - 11.40) < 0.001);
        return n >= 7.00 && n <= 13.60 && !isExcluded;
      }

      var fw = detectFirmware();
      var fwStr = fw ? fw.str : fwParam;
      var fwNum = fw ? fw.num : (fwParam ? parseFloat(fwParam) : 0);
      var hasUmtx2 = isUmtx2Supported(fwNum);
      var hasPoops = isPoopsSupported(fwNum);
      var hasRelapse = isRelapseSupported(fwNum, fwStr);
      var isUnsupported = fwNum > 0 && !hasUmtx2 && !hasPoops && !hasRelapse;
      var isDualSupported = (hasPoops && hasRelapse) || (!fw && !fwParam);
      var needsChoice = isDualSupported && !chosenExploit;

      function chooseExploit(choice) {
        if (btnPoops) btnPoops.disabled = true;
        if (btnRelapse) btnRelapse.disabled = true;
        statusEl.textContent = 'تم اختيار ' + (choice === 'poops' ? 'Poops' : 'Relapse') + '...';
        detailEl.textContent = 'جارٍ تحضير تنزيل الذاكرة المؤقتة...';
        try {
          localStorage.setItem('wkal_exploit', choice);
        } catch (e) { }
        var p = new URLSearchParams(window.location.search);
        p.set('exploit', choice);
        window.location.replace(window.location.pathname + '?' + p.toString());
      }

      if (btnPoops) {
        btnPoops.addEventListener('click', function () {
          chooseExploit('poops');
        });
      }
      if (btnRelapse) {
        btnRelapse.addEventListener('click', function () {
          chooseExploit('relapse');
        });
      }

      var logContainer = document.getElementById('logContainer');
      var seenLogs = "";

      function appendLog(msg) {
        if (needsChoice || isUnsupported) return;
        logContainer.hidden = false;
        var div = document.createElement('div');
        div.textContent = msg;
        logContainer.appendChild(div);
        logContainer.scrollTop = logContainer.scrollHeight;
      }


      var logPos = 0;
      var logXhr = null;

      function pollLogs() {
        if (needsChoice || isUnsupported) return;
        logXhr = new XMLHttpRequest();
        logXhr.open('GET', '/logs?pos=' + logPos, true);
        logXhr.onreadystatechange = function () {
          if (logXhr.readyState === 4) {
            if (logXhr.status === 200) {
              var newLogs = logXhr.responseText;
              if (newLogs.length > 0) {
                var lines = newLogs.split('\n');
                for (var i = 0; i < lines.length; i++) {
                  if (lines[i].trim() !== '') appendLog(lines[i]);
                }
              }
              var newPosStr = logXhr.getResponseHeader("X-Log-Pos");
              if (newPosStr) {
                logPos = parseInt(newPosStr, 10);
              }
              // إضافة تأخير بسيط قبل إعادة الاتصال لتقليل الحمل على الخادم
              setTimeout(pollLogs, 100);
            } else {
              // الخادم متوقف أو حدث خطأ
              if (completed) return; // إيقاف الاستطلاع تمامًا إذا انتهينا
              setTimeout(pollLogs, 1000);
            }
          }
        };
        logXhr.send();
      }
      // بدء حلقة الاستطلاع الطويل فقط أثناء التخزين المؤقت (ليس عند الاختيار ولا عند عدم الدعم)
      if (!needsChoice && !isUnsupported) {
        pollLogs();
      }


      var probeOk = false;


      var AUTOLOADER_URL = '/app/index.html';

      function setProgress(pct) {
        progressBar.style.webkitTransform = 'scaleX(' + pct / 100 + ')';
        progressBar.style.transform = 'scaleX(' + pct / 100 + ')';
        progressPct.textContent = pct + '%';
      }

      function setInstalled() {
        statusEl.textContent = 'تم التثبيت بنجاح';
        statusEl.style.color = '#22c55e';
        progressBar.style.background = '-webkit-linear-gradient(90deg, #16a34a 0%, #22c55e 100%)';
        detailEl.textContent = 'أصبح اختصار مُحمّل WebKit التلقائي الآن على الشاشة الرئيسية لجهاز PS5. يمكنك إغلاق هذه الصفحة.';
        setProgress(100);
      }

      function setFailed() {
        statusEl.textContent = 'فشل التثبيت';
        statusEl.style.color = '#ef4444';
        progressBar.style.background = '-webkit-linear-gradient(90deg, #dc2626 0%, #ef4444 100%)';
        detailEl.textContent = 'تعذّر تثبيت التطبيق. أغلق هذه الصفحة وأعد تشغيل المثبّت.';
      }

      function setSlow() {
        statusEl.textContent = 'التخزين المؤقت يستغرق وقتًا أطول من المعتاد';
        detailEl.textContent = 'لا يُنشأ الاختصار إلا بعد اكتمال التخزين المؤقت. إذا لم يكتمل أبدًا، أغلق المتصفح وأعد تشغيل المثبّت.';
      }

      function setCaching() {
        statusEl.textContent = 'جارٍ تخزين المحتوى مؤقتًا...';
        detailEl.textContent = 'يرجى الانتظار قليلًا. لا تغلق هذه الصفحة بعد!';
        progressWrap.hidden = false;
        if (!logXhr) {
          pollLogs();
        }
      }

      function goToAutoloader() {
        window.location.replace(AUTOLOADER_URL);
      }

      function probeServer() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/version', true);
        xhr.timeout = 1000;
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              var hdrUid = xhr.getResponseHeader("X-User-Id");
              if (hdrUid) currentUid = hdrUid;
              probeOk = true;
              setCaching();
            } else {
              goToAutoloader();
            }
          }
        };
        xhr.onerror = function () {
          goToAutoloader();
        };
        xhr.ontimeout = function () {
          goToAutoloader();
        };
        xhr.send();
      }

      function installApp() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/install', true);
        xhr.timeout = 30000;
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              setInstalled();
            } else {
              setFailed();
            }
          }
        };
        xhr.onerror = function () {
          setFailed();
        };
        xhr.ontimeout = function () {
          setFailed();
        };
        xhr.send();
      }

      function maybeInstall() {
        if (completed) {
          return;
        }
        completed = true;
        installApp();
      }

      function setCacheCorrupted() {
        if (corruptionPromptShown) {
          return;
        }
        corruptionPromptShown = true;
        completed = true;
        progressWrap.hidden = true;
        logContainer.hidden = true;
        statusEl.textContent = 'فشل التخزين المؤقت';
        detailEl.textContent = '';

        var overlay = document.createElement('div');
        overlay.id = 'cacheCorruptOverlay';

        var card = document.createElement('div');
        card.className = 'card';

        var title = document.createElement('h2');
        var msg = document.createElement('p');
        var actions = null;

        var webkitShellPath = '/user/home/' + (currentUid || '<userid>') + '/webkit/shell/';

        if (isRetry) {
          title.textContent = 'مشكلة الذاكرة المؤقتة لا تزال قائمة';
          msg.textContent = 'يبدو أن مسح بيانات WebKit من ' + webkitShellPath + ' لم يحل المشكلة. يمكنك إغلاق هذه الصفحة.';
          var exitXhr = new XMLHttpRequest();
          exitXhr.open('GET', '/exit', true);
          exitXhr.send();
        } else {
          title.textContent = 'يبدو أن الذاكرة المؤقتة لـ WebKit تالفة';
          msg.textContent = 'قد تكون بيانات متصفح WebKit على جهاز PS5 تالفة، مما يمنع اكتمال التخزين المؤقت. قد يؤدي مسحها إلى حل المشكلة. ';
          var strong = document.createElement('strong');
          strong.textContent = 'سيؤدي هذا إلى حذف جميع بيانات المتصفح في ' + webkitShellPath + ' (ذاكرة AppCache وملفات تعريف الارتباط والتخزين المحلي) للمستخدم الحالي.';
          msg.appendChild(strong);

          actions = document.createElement('div');
          actions.className = 'actions';

          var clearBtn = document.createElement('button');
          clearBtn.className = 'btn primary';
          clearBtn.textContent = 'مسح بيانات WebKit وإعادة المحاولة';
          clearBtn.addEventListener('click', function () {
            actions.hidden = true;
            actions.style.display = 'none';
            msg.textContent = 'جارٍ مسح البيانات وإعادة تشغيل المتصفح...';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/clear-webkit-data', true);
            xhr.timeout = 30000;
            xhr.onreadystatechange = function () {
              if (xhr.readyState === 4 && xhr.status !== 200) {
                msg.textContent = 'فشل مسح بيانات WebKit';
                actions.hidden = false;
                actions.style.display = '';
              }
            };
            xhr.onerror = function () {
              msg.textContent = 'فشل مسح بيانات WebKit';
              actions.hidden = false;
              actions.style.display = '';
            };
            xhr.ontimeout = function () {
              msg.textContent = 'فشل مسح بيانات WebKit';
              actions.hidden = false;
              actions.style.display = '';
            };
            xhr.send();
          });
          actions.appendChild(clearBtn);

          var cancelBtn = document.createElement('button');
          cancelBtn.className = 'btn secondary';
          cancelBtn.textContent = 'إلغاء';
          cancelBtn.addEventListener('click', function () {
            msg.textContent = 'يمكنك إغلاق هذه الصفحة. أعد تشغيل ملف ELF الخاص بالمثبّت للمحاولة مرة أخرى.';
            actions.hidden = true;
            actions.style.display = 'none';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/exit', true);
            xhr.send();
          });
          actions.appendChild(cancelBtn);
        }

        card.appendChild(title);
        card.appendChild(msg);
        if (actions) {
          card.appendChild(actions);
        }
        overlay.appendChild(card);
        document.body.appendChild(overlay);
      }

      window.addEventListener('load', function () {
        /* خطاف اختبار: ?simulate=corrupt يفرض ظهور رسالة التلف كما لو حدث
         * خطأ AppCache أثناء التنزيل، ويتخطى استطلاع الفحص/التثبيت
         * ليبقى التحذير ظاهرًا لاختبار الواجهة (مثل make dev). */
        if (simulateCorrupt) {
          isDownloading = true;
          setCacheCorrupted();
          return;
        }

        if (needsChoice) {
          statusEl.textContent = 'اختر الاستغلال';
          var fwDisplay = fw ? ('الإصدار ' + fw.str) : (fwParam ? ('الإصدار ' + fwParam) : 'إصدارك');
          detailEl.textContent = '';
          detailEl.appendChild(document.createTextNode(fwDisplay + ' يدعم كلاً من Poops وRelapse.'));
          detailEl.appendChild(document.createElement('br'));
          detailEl.appendChild(document.createTextNode('اختر أيًّا منهما للتثبيت:'));
          choiceContainer.hidden = false;
          logContainer.hidden = true;
          var storedPref = '';
          try { storedPref = localStorage.getItem('wkal_exploit'); } catch (e) { }
          if (storedPref === 'relapse' && btnRelapse) {
            btnRelapse.classList.add('selected');
            btnRelapse.focus();
          } else if (storedPref === 'poops' && btnPoops) {
            btnPoops.classList.add('selected');
            btnPoops.focus();
          } else if (btnPoops) {
            btnPoops.focus();
          }
          return;
        }

        if (isUnsupported) {
          statusEl.textContent = 'إصدار غير مدعوم';
          statusEl.style.color = '#ef4444';
          var fwDisplay = fw ? ('الإصدار ' + fw.str) : (fwParam ? ('الإصدار ' + fwParam) : 'إصدارك');
          detailEl.textContent = fwDisplay + ' غير مدعوم (المدعوم: 1.00–5.50 عبر umtx2، و7.00–12.00 عبر poops، و7.00–13.60 عبر relapse).';
          return;
        }

        var effectiveExploit = '';
        if (hasUmtx2) {
          effectiveExploit = 'umtx2';
        } else if (hasPoops && !hasRelapse) {
          effectiveExploit = 'poops';
        } else if (hasRelapse && !hasPoops) {
          effectiveExploit = 'relapse';
        } else if (hasPoops && hasRelapse) {
          effectiveExploit = (chosenExploit === 'poops') ? 'poops' : 'relapse';
        } else if (chosenExploit) {
          effectiveExploit = chosenExploit;
        }
        if (effectiveExploit) {
          try {
            localStorage.setItem('wkal_exploit', effectiveExploit);
          } catch (e) { }
        }

        probeServer();

        /* يُنشأ الاختصار فقط عندما تصبح ذاكرة AppCache محدّثة، لذا لا يثبّت
           المثبّت أبدًا ذاكرة مؤقتة جزئية. بعد ذلك يقوم /install بتثبيت
           تطبيق الشاشة الرئيسية وإيقاف الخادم معًا. */
        var waitTimer = setInterval(function () {
          if (completed) {
            clearInterval(waitTimer);
            return;
          }
          if (!probeOk) {
            clearInterval(waitTimer);
            goToAutoloader();
            return;
          }
          if (!window.applicationCache) {
            clearInterval(waitTimer);
            maybeInstall();
            return;
          }
          if (window.applicationCache.status === window.applicationCache.UPDATEREADY) {
            clearInterval(waitTimer);
            try {
              window.applicationCache.swapCache();
            } catch (e) { }
            maybeInstall();
            return;
          }
        }, 1000);

        /* حدّ أمان — لا يترك المثبّت معلّقًا على الشاشة أبدًا. وهو لا يثبّت
           ولا يخرج: يجب ألا تُنشئ ذاكرة مؤقتة جزئية اختصارًا أبدًا، لذا
           يعيد المستخدم ببساطة تشغيل المثبّت إذا لم يكتمل هذا أبدًا. */
        setTimeout(function () {
          if (!completed && probeOk) {
            setSlow();
          }
        }, 120000);
      });


      if (window.applicationCache) {
        window.applicationCache.addEventListener('checking', function () {
          progressWrap.hidden = false;
          appendLog("[AppCache] جارٍ التحقق من الملف التعريفي...");
        });
        window.applicationCache.addEventListener('downloading', function () {
          isDownloading = true;
          appendLog("[AppCache] جارٍ تنزيل الذاكرة المؤقتة...");
        });
        window.applicationCache.addEventListener('progress', function (e) {
          if (e.url) appendLog("[AppCache] جارٍ جلب: " + e.url);
          if (e.total && e.total > 0) {
            var pct = Math.min(99, Math.round((e.loaded / e.total) * 100));
            setProgress(pct);
          }
        });
        window.applicationCache.addEventListener('error', function (e) {
          appendLog("[AppCache] حدث خطأ! الحالة: " + window.applicationCache.status);
          logContainer.className = 'error';
          if (isDownloading) {
            setCacheCorrupted();
          }
        });
        window.applicationCache.addEventListener('obsolete', function (e) {
          appendLog("[AppCache] الملف التعريفي مهجور.");
        });
        window.applicationCache.addEventListener('cached', function() {
          isDownloading = false;
          appendLog("[AppCache] اكتمل التخزين المؤقت.");
          maybeInstall();
        });
        window.applicationCache.addEventListener('noupdate', function() {
          isDownloading = false;
          appendLog("[AppCache] لا حاجة للتحديث.");
          maybeInstall();
        });
        window.applicationCache.addEventListener('updateready', function () {
          isDownloading = false;
          if (window.applicationCache.status === window.applicationCache.UPDATEREADY) {
            try {
              window.applicationCache.swapCache();
            } catch (e) { }
          }
          appendLog("[AppCache] التحديث جاهز.");
          maybeInstall();
        });
      }
    })();
  </script>
</body>

</html>
