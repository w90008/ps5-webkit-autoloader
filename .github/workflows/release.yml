name: Release On-Demand

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: stable

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      full_version: ${{ steps.version.outputs.full_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract Version
        id: version
        run: |
          VERSION=$(grep '#define WKAL_VERSION' include/wkali.h | awk '{print $3}' | tr -d '"' | tr -d '\r')

          if [ -z "$VERSION" ]; then
            echo "Error: Could not find WKAL_VERSION in include/wkali.h"
            exit 1
          fi

          FULL=$(python3 tools/gen_version.py --print)

          echo "Base version: $VERSION"
          echo "Full version: $FULL"

          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "full_version=${FULL}" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 1
          fi

          echo "Release $TAG does not exist. Proceeding."

      - name: Build WebKit Autoloader
        run: |
          chmod +x build_release.sh
          ./build_release.sh

      - name: Verify Linux Build
        run: |
          echo "Build output:"
          ls -lah

          echo "Checking required files..."

          test -f webkit-autoloader-installer_v*.elf
          test -f webkit-autoloader-host_v*.py

          echo "Linux build OK."

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            webkit-autoloader-installer_v*.elf
            webkit-autoloader-host_v*.py
            assets/icon.ico
          retention-days: 1

  build-windows:
    needs: build-linux
    runs-on: windows-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: .

      - name: Show downloaded files
        shell: pwsh
        run: |
          Write-Host "Downloaded files:"
          Get-ChildItem -Recurse

      - name: Build Windows Executable
        shell: pwsh
        run: |
          $FULL = "${{ needs.build-linux.outputs.full_version }}"
          $PY = "webkit-autoloader-host_v$FULL.py"

          Write-Host "Building: $PY"

          if (!(Test-Path $PY)) {
            Write-Error "Python host file was not found: $PY"
            exit 1
          }

          pyinstaller `
            --onefile `
            --noconfirm `
            --clean `
            --icon assets/icon.ico `
            --name "webkit-autoloader-host_v$FULL" `
            "$PY"

      - name: Verify Windows Build
        shell: pwsh
        run: |
          $FULL = "${{ needs.build-linux.outputs.full_version }}"
          $EXE = "dist/webkit-autoloader-host_v$FULL.exe"

          Write-Host "Checking: $EXE"

          if (!(Test-Path $EXE)) {
            Write-Error "Windows EXE was not created."
            Get-ChildItem -Recurse
            exit 1
          }

          Write-Host "Windows build OK."

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/webkit-autoloader-host_v*.exe
          retention-days: 1

  create-release:
    needs:
      - build-linux
      - build-windows

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: linux-build

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows-build

      - name: Prepare Release Files
        run: |
          set -euo pipefail

          FULL="${{ needs.build-linux.outputs.full_version }}"

          ELF="webkit-autoloader-installer_v${FULL}.elf"
          PY="webkit-autoloader-host_v${FULL}.py"
          EXE="webkit-autoloader-host_v${FULL}.exe"

          echo "Looking for:"
          echo "$ELF"
          echo "$PY"
          echo "$EXE"

          find linux-build -type f -print
          find windows-build -type f -print

          cp "linux-build/$ELF" "$ELF"
          cp "linux-build/$PY" "$PY"
          cp "windows-build/$EXE" "$EXE"

          echo "Release files:"
          ls -lah "$ELF" "$PY" "$EXE"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -euo pipefail

          TAG="${{ needs.build-linux.outputs.tag }}"
          FULL="${{ needs.build-linux.outputs.full_version }}"
          REPO="${{ github.repository }}"

          ELF="webkit-autoloader-installer_v${FULL}.elf"
          PY="webkit-autoloader-host_v${FULL}.py"
          EXE="webkit-autoloader-host_v${FULL}.exe"

          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG="**Full Changelog** (since [${PREV_TAG}](https://github.com/${REPO}/releases/tag/${PREV_TAG})): https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
          else
            CHANGELOG="First Release."
          fi

          cat > release_body.md <<EOF
          ## Downloads

          | Platform | File |
          |---|---|
          | **PS5** | ${ELF} |
          | **Linux / macOS / WSL** | ${PY} |
          | **Windows** | ${EXE} |

          ---

          ${CHANGELOG}
          EOF

          echo "Creating release: $TAG"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_body.md \
            "$ELF" \
            "$PY" \
            "$EXE"

          echo "Release created successfully."
