name: Release On-Demand

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            cmake \
            ninja-build \
            clang-18 \
            lld-18 \
            python3 \
            python3-pyelftools \
            wget \
            xz-utils \
            pkg-config \
            unzip \
            librsvg2-bin

      - name: Build PS5 SDK
        run: |
          git clone https://github.com /tmp/ps5-payload-sdk-source
          cd /tmp/ps5-payload-sdk-source
          make -j"$(nproc)" DESTDIR=/opt/ps5-payload-sdk install

      - name: Build PS5 dependencies
        run: |
          chmod +x build_deps.sh
          sudo bash build_deps.sh

      - name: Build installer ELF
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          BUILD_TYPE: dev
          FORCE_EXPLOIT: auto
        run: |
          make clean
          make all

      - name: Build PC host
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          BUILD_TYPE: dev
          FORCE_EXPLOIT: auto
        run: |
          make host HOST_PAYLOAD=installer.elf

      - name: Prepare and Rename Artifacts for Release
        run: |
          mkdir -p release_assets
          cp installer.elf release_assets/webkit-autoloader-installer_v0.4.0.elf
          cp webkit-autoloader-host.py release_assets/webkit-autoloader-host_v0.4.0.py
          echo "===== PREPARED ASSETS ====="
          ls -lh release_assets/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0
          name: PS5 WebKit Autoloader v0.4.0 (Custom Build)
          body: |
            Automated custom build containing your specific assets and icon layout.
          files: |
            release_assets/webkit-autoloader-installer_v0.4.0.elf
            release_assets/webkit-autoloader-host_v0.4.0.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
